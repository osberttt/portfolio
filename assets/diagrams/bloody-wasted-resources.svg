<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d1530"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Arrows -->
  <g fill="none" stroke="#1d1530" stroke-width="4" marker-end="url(#ah)">
    <line x1="285" y1="480" x2="525" y2="232"/>
    <line x1="755" y1="232" x2="995" y2="480"/>
    <line x1="375" y1="540" x2="900" y2="540"/>
  </g>

  <!-- Nodes -->
  <g>
    <rect x="510" y="115" width="260" height="110" rx="22" fill="#d5bfff" stroke="#1d1530" stroke-width="4"/>
    <text x="640" y="163" text-anchor="middle" font-size="26" font-weight="700" fill="#1d1530">BLOOD</text>
    <text x="640" y="195" text-anchor="middle" font-size="19" fill="#1d1530">drains all the time</text>

    <rect x="110" y="485" width="260" height="110" rx="22" fill="#f5cfa4" stroke="#1d1530" stroke-width="4"/>
    <text x="240" y="533" text-anchor="middle" font-size="26" font-weight="700" fill="#1d1530">TIME</text>
    <text x="240" y="565" text-anchor="middle" font-size="19" fill="#1d1530">~30 s until sunrise</text>

    <rect x="905" y="485" width="270" height="110" rx="22" fill="#b5d3f8" stroke="#1d1530" stroke-width="4"/>
    <text x="1040" y="533" text-anchor="middle" font-size="26" font-weight="700" fill="#1d1530">DISTANCE</text>
    <text x="1040" y="565" text-anchor="middle" font-size="19" fill="#1d1530">the way home</text>
  </g>

  <!-- Eat label -->
  <g>
    <rect x="215" y="285" width="200" height="110" rx="16" fill="#fff" stroke="#1d1530" stroke-width="3"/>
    <text x="315" y="322" text-anchor="middle" font-size="24" font-weight="700" fill="#1d1530">EAT</text>
    <text x="315" y="352" text-anchor="middle" font-size="20" font-weight="600" fill="#2f7d5b">+ blood</text>
    <text x="315" y="380" text-anchor="middle" font-size="20" font-weight="600" fill="#c0264a">− time (you freeze)</text>
  </g>

  <!-- Dash label -->
  <g>
    <rect x="865" y="285" width="200" height="110" rx="16" fill="#fff" stroke="#1d1530" stroke-width="3"/>
    <text x="965" y="322" text-anchor="middle" font-size="24" font-weight="700" fill="#1d1530">DASH</text>
    <text x="965" y="352" text-anchor="middle" font-size="20" font-weight="600" fill="#2f7d5b">+ distance</text>
    <text x="965" y="380" text-anchor="middle" font-size="20" font-weight="600" fill="#c0264a">− blood</text>
  </g>

  <!-- Run label -->
  <g>
    <rect x="540" y="590" width="200" height="60" rx="16" fill="#fff" stroke="#1d1530" stroke-width="3"/>
    <text x="640" y="616" text-anchor="middle" font-size="22" font-weight="700" fill="#1d1530">RUN</text>
    <text x="640" y="640" text-anchor="middle" font-size="18" fill="#1d1530">time passes, you move</text>
  </g>

  <!-- Goal -->
  <text x="640" y="340" text-anchor="middle" font-size="30" font-weight="700" fill="#1d1530">Get home before sunrise</text>
  <text x="640" y="376" text-anchor="middle" font-size="20" fill="#5d6873">enough distance, in ~30 seconds</text>

  <text x="640" y="695" text-anchor="middle" font-size="18" fill="#5d6873">Every choice trades one resource for another.</text>
</svg>
