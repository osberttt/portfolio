<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Osbert | Game Designer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%23a8efdc' stroke='%2312161f' stroke-width='3'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='%2312161f' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lanes.css">
  <link rel="stylesheet" href="css/frame.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/media.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/case.css">
  <link rel="stylesheet" href="css/widgets.css">
  <link rel="stylesheet" href="css/projects.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/lightbox.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Side lanes: seamless texture background (see .lanes in style.css to swap it) -->
  <div class="lanes" id="lanes" aria-hidden="true">
    <div class="lane-layer" id="lane-layer">
      <div class="brush" id="brush"></div>
    </div>
  </div>

  <div class="hud hud-l" id="hud-l" aria-hidden="true"></div>
  <div class="hud hud-r" id="hud-r" aria-hidden="true"></div>

  <div class="frame" id="frame">
    <div class="frame-tab" aria-hidden="true"><span class="frame-tab-dot"></span><span id="frame-tab-text">~/home</span></div>
    <i class="mark tl"></i><i class="mark tr"></i><i class="mark bl"></i><i class="mark br"></i>

    <div class="frame-inner">
      <!-- Nav text (name, tab labels) is filled in from data/ by js/app.js -->
      <nav class="nav" id="nav" aria-label="Main">
        <div class="nav-left">
          <button class="nav-back" id="nav-back" type="button" hidden></button>
          <a class="brand" href="#/">
            <span class="brand-name" id="brand-name"></span>
          </a>
        </div>
        <div class="tabs pill-group" id="tabs">
          <span class="pill-ind" aria-hidden="true"></span>
          <a class="tab" href="#/" data-tab="home"></a>
          <a class="tab" href="#/projects" data-tab="projects"></a>
          <a class="tab" href="#/about" data-tab="about"></a>
        </div>
        <span class="progress" id="progress" aria-hidden="true"></span>
      </nav>

      <div class="stage">
        <main class="scroller" id="scroller" tabindex="-1">
          <div id="view"></div>
        </main>
        <div class="sbar" id="sbar" aria-hidden="true"><div class="sbar-thumb" id="sbar-thumb"></div></div>
        <div class="shutter is-initial" id="shutter" aria-hidden="true">
          <i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i>
          <span class="shutter-label" id="shutter-label"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="preview" id="preview" aria-hidden="true"></div>
  <!-- Screenshot viewer: filled in by js/shell/lightbox.js -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden></div>

  <!-- Content: edit these. See data/README.md -->
  <script src="data/site.js"></script>
  <script src="data/ui.js"></script>
  <script src="data/tuning.js"></script>
  <script src="data/words.js"></script>
  <script src="data/games/amy-died-of-700-tacos.js"></script>
  <script src="data/games/ghost-with-shadow.js"></script>
  <script src="data/games/bloody-wasted.js"></script>
  <script src="data/games/catch-my-favourite-tv-show.js"></script>
  <script src="data/jams.js"></script>

  <!-- Code: order matters (core → ui → widgets → pages → behaviors → shell → app) -->
  <script src="js/core/util.js"></script>
  <script src="js/core/phrases.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/ui/templates.js"></script>
  <script src="js/widgets/tacos.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/case.js"></script>
  <script src="js/pages/projects.js"></script>
  <script src="js/pages/about.js"></script>
  <script src="js/behaviors/reveal.js"></script>
  <script src="js/behaviors/magnetic.js"></script>
  <script src="js/behaviors/videos.js"></script>
  <script src="js/behaviors/persona.js"></script>
  <script src="js/behaviors/precise.js"></script>
  <script src="js/behaviors/marquee.js"></script>
  <script src="js/behaviors/deck.js"></script>
  <script src="js/behaviors/numfx.js"></script>
  <script src="js/behaviors/toc.js"></script>
  <script src="js/behaviors/projects-ui.js"></script>
  <script src="js/shell/scroll.js"></script>
  <script src="js/shell/cursor.js"></script>
  <script src="js/shell/lightbox.js"></script>
  <script src="js/shell/interactions.js"></script>
  <script src="js/shell/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
